<form hx-post="{% if request.user.matrimony_profile.id %}{% url 'accounts:update_profile' request.user.matrimony_profile.id %}{% else %}{% url 'accounts:create_profile' %}{% endif %}" hx-target='#profile-info' hx-swap='outerHTML'>
    {% csrf_token %}
    {% load crispy_forms_tags %}
    {{ form|crispy }}
    <button class="btn btn-primary" type="submit">Update</button>
</form>
