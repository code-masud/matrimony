<!-- Chat Header -->
<div id="chat-window">
  {% load static %} {% load is_presence %}
  <div class="d-flex align-items-center mb-3 border-bottom p-3">
    {% if other.matrimony_profile.profile_picture %}
    <img
      class="rounded-circle me-2"
      src="{{ other.matrimony_profile.profile_picture.url }}"
      alt="{{ other.get_username}} Photo"
    />
    {% else %}
    <img
      class="rounded-circle me-2"
      src="{% static 'avatar/male.png' %}"
      alt="{{ other.get_username}} Photo"
    />
    {% endif %}
    <div>
      <h5 class="mb-0">
        {{ other.get_username }}
        <span
          class="presence_status_online_{{ other.id }} status-dot online {% if not other|is_presence %}d-none{% endif %}"
        ></span>
        <span
          class="presence_status_offline_{{ other.id }} status-dot offline {% if other|is_presence %}d-none{% endif %}"
        ></span>
      </h5>
    </div>
  </div>

  <!-- Chat Messages -->
  <div class="chat-messages" id="chat-messages">
    {% for message in messages %} {% if message.sender == other %}
    <div class="message received">{{ message.content }}</div>
    {% else %}
    <div class="message sent">{{ message.content }}</div>
    {% endif %} {% endfor %}
  </div>

  <!-- Chat Input -->
  <div class="chat-input d-flex p-3 border-top">
    <input
      id="msg"
      type="text"
      class="form-control me-2"
      placeholder="Type a message..."
    />
    <button class="btn btn-primary" onclick="sendMsg()">
      <i class="bi bi-send"></i>
    </button>
  </div>
  <div id="typing-indicator" class="text-muted">
    <small><span id="typing-user"></span></small>
  </div>
</div>

<script>
  (function () {
    if (window.chatSocket) {
      window.chatSocket.close();
    }

    const otherUser = "{{ other.username }}";
    const input = document.getElementById("msg");
    const messages = document.getElementById("chat-messages");
    const typingUser = document.getElementById("typing-user");
    let typingTimeout;

    window.chatSocket = new WebSocket(
      "ws://" + window.location.host + "/ws/private/" + otherUser + "/",
    );

    window.chatSocket.onopen = () => {
      console.log("Connected to Server");
    };

    window.chatSocket.onmessage = (e) => {
      const data = JSON.parse(e.data);
      console.log(data);

      if (data.type === "chat.message") {
        const isMine = data.sender === "{{ request.user.username }}";
        messages.innerHTML += `
          <div class="${isMine ? "message sent" : "message received"}">
            ${data.message}
          </div>
        `;
        messages.scrollTop = messages.scrollHeight;
      }

      if (data.type === "typing") {
        typingUser.innerHTML = `${data.user} typing...`;
      }

      if (data.type === "stop_typing") {
        typingUser.innerHTML = "";
      }
    };

    window.chatSocket.onerror = (error) => {
      console.error("WebSocket Error:", error);
    };

    window.chatSocket.onclose = () => {
      console.log("Disconnected");
    };

    // Send chat message
    window.sendMsg = () => {
      if (!input.value.trim()) return;
      window.chatSocket.send(
        JSON.stringify({ type: "chat.message", message: input.value }),
      );
      input.value = "";
      input.focus();
    };

    // Typing indicator
    input.addEventListener("input", () => {
      window.chatSocket.send(JSON.stringify({ type: "typing" }));

      if (typingTimeout) clearTimeout(typingTimeout);

      typingTimeout = setTimeout(() => {
        window.chatSocket.send(JSON.stringify({ type: "stop_typing" }));
      }, 2000);
    });

    // Send message on Enter
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        window.sendMsg();
      }
    });
  })();
</script>
