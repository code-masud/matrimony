{% extends "profile.html" %} {% block main %}
<style>
  .chat-container {
    height: 95vh;
    background: #f8f9fa;
  }

  /* Sidebar */
  .chat-list {
    border-right: 1px solid #e5e7eb;
    background: #fff;
    overflow-y: auto;
  }

  .chat-list .list-group-item {
    border: none;
    cursor: pointer;
    transition: background 0.2s;
  }

  .chat-list .list-group-item:hover {
    background: #f1f5f9;
  }

  /* Chat box */
  .chat-box {
    display: flex;
    flex-direction: column;
    height: 100%;
    background: #fff;
  }

  /* Header */
  .chat-header {
    border-bottom: 1px solid #e5e7eb;
    background: #ffffff;
  }

  /* Messages */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    background: #f1f5f9;
  }

  .message {
    max-width: 65%;
    padding: 10px 14px;
    border-radius: 15px;
    margin-bottom: 10px;
    position: relative;
    font-size: 14px;
  }

  .message.sent {
    background: #4f46e5;
    color: white;
    margin-left: auto;
    border-bottom-right-radius: 5px;
  }

  .message.received {
    background: #e5e7eb;
    color: #111827;
    margin-right: auto;
    border-bottom-left-radius: 5px;
  }

  .ticks {
    font-size: 12px;
    margin-left: 6px;
  }

  /* Input */
  .chat-input {
    border-top: 1px solid #e5e7eb;
    background: #fff;
  }

  .chat-input input {
    border-radius: 25px;
    padding: 10px 15px;
  }

  .chat-input button {
    border-radius: 50%;
    width: 45px;
    height: 45px;
  }

  /* Avatar */
  .avatar {
    width: 40px;
    height: 40px;
    object-fit: cover;
  }

  /* Status dot */
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .online {
    background: #22c55e;
  }
  .offline {
    background: #9ca3af;
  }

  /* Typing */
  #typing-indicator {
    padding-left: 15px;
    font-size: 13px;
    color: #6b7280;
  }
</style>
{% load static is_presence %}
<div class="row chat-container">
  <!-- Sidebar -->
  <div class="col-md-4 chat-list p-0">
    <div class="p-3 fw-bold border-bottom">Chats</div>

    <ul class="list-group list-group-flush">
      {% for user in users %}
      <li
        hx-get="{% url 'chat:private_chat' user.id %}"
        hx-target="#chat-window"
        hx-swap="outerHTML"
        class="list-group-item d-flex align-items-center gap-2"
      >
        <img
          class="rounded-circle avatar"
          src="{% if user.matrimony_profile.profile_picture %}
              {{ user.matrimony_profile.profile_picture.url }}
            {% else %}
              {% static 'avatar/male.png' %}
            {% endif %}"
        />

        <div class="flex-grow-1">
          <div class="fw-semibold">
            {{ user.username }}
            <span
              class="status-dot {% if user|is_presence %}online{% else %}offline{% endif %}"
            ></span>
          </div>
        </div>
      </li>
      {% endfor %}
    </ul>
  </div>

  <!-- Chat -->
  <div class="col-md-8 chat-box p-0">
    <div id="chat-window"></div>
  </div>
</div>

<script>
  const presenceSocket = new WebSocket(
    "ws://" + window.location.host + "/ws/presence/",
  );

  presenceSocket.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === "presence_broadcast") {
      const isOnline = data.status === "online";

      document
        .querySelectorAll(`.presence_status_online_${data.user}`)
        .forEach((el) => el.classList.toggle("d-none", !isOnline));

      document
        .querySelectorAll(`.presence_status_offline_${data.user}`)
        .forEach((el) => el.classList.toggle("d-none", isOnline));

      const lastSeen = document.getElementById("last_seen");

      if (data.status === "offline") {
        if (lastSeen) {
          lastSeen.textContent = `last seen just now`;
        }
      } else {
        if (lastSeen) {
          lastSeen.textContent = ``;
        }
      }
    }
  };

  presenceSocket.onopen = () => {
    console.log("Connected");
  };

  presenceSocket.onerror = (error) => {
    console.log("Socket error: " + error);
  };

  presenceSocket.onclose = () => {
    console.log("Socket close unexpectedly");
  };
</script>

{% endblock %}
