<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; }
        .box {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }
        .highlight {
            color: #e91e63;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Profile Views Update</h2>
        <p>
            You have received 
            <span class="highlight">{{ total_views }}</span> 
            new profile views.
        </p>
        <p>Login to check who viewed your profile.</p>
    </div>
</body>
</html>
