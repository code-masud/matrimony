{% extends 'profile.html' %} {% block main %}
    <style>
        body {
            background-color: #f8f9fa;
        }
        .success-card {
            max-width: 600px;
            margin: 80px auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            padding: 40px 20px;
        }
        .success-icon {
            font-size: 4rem;
            color: #af1010;
        }
    </style>
    <div class="success-card">
        <i class="bi bi-slash-circle success-icon"></i>
        <h2 class="fw-bold mt-3">Payment Fail!</h2>
        <p class="text-muted">
            Your payment has been <strong>failed</strong>. Please try again.
        </p>

        <div class="mt-4">
            <a href="profile.html" class="btn btn-primary me-2"><i class="bi bi-person"></i> Go to Profile</a>
        </div>
    </div>
{% endblock %}
