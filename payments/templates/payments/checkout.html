{% extends "profile.html" %}
{% block main %}
  <style>
    .checkout-card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .plan-summary {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .price {
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
  <br>
  <div class="row">
    
    <!-- Left Column: Billing & Payment -->
    <div class="col-md-7">
      <div class="card checkout-card p-4 mb-4">
        <h4 class="fw-bold mb-3">Billing Details</h4>
        <form>
          <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" placeholder="Enter your email">
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" placeholder="Enter your phone">
          </div>
          <div class="mb-3">
            <label class="form-label">Address</label>
            <textarea class="form-control" rows="2" placeholder="Enter your address"></textarea>
          </div>
        </form>
      </div>

      <div class="card checkout-card p-4">
        <h4 class="fw-bold mb-3">Payment Method</h4>
        <form>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="paymentMethod" id="creditCard" checked>
            <label class="form-check-label" for="creditCard">
              <i class="bi bi-credit-card"></i> Credit/Debit Card
            </label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="paymentMethod" id="paypal">
            <label class="form-check-label" for="paypal">
              <i class="bi bi-paypal"></i> PayPal
            </label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="paymentMethod" id="bank">
            <label class="form-check-label" for="bank">
              <i class="bi bi-bank"></i> Bank Transfer
            </label>
          </div>

          <!-- Card Details -->
          <div class="mt-3">
            <label class="form-label">Card Number</label>
            <input type="text" class="form-control" placeholder="1234 5678 9012 3456">
          </div>
          <div class="row mt-3">
            <div class="col-md-6">
              <label class="form-label">Expiry Date</label>
              <input type="text" class="form-control" placeholder="MM/YY">
            </div>
            <div class="col-md-6">
              <label class="form-label">CVV</label>
              <input type="text" class="form-control" placeholder="123">
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Right Column: Plan Summary -->
    <div class="col-md-5">
      <div class="plan-summary">
        <h4 class="fw-bold mb-3">Membership Summary</h4>
        <p><strong>Plan:</strong> Gold Membership</p>
        <p><strong>Duration:</strong> 1 Month</p>
        <p><strong>Features:</strong></p>
        <ul>
          <li>Unlimited Profile Views</li>
          <li>Send Interests</li>
          <li>Chat Access</li>
          <li>Priority Support</li>
        </ul>
        <p class="price">$39.00</p>
        <button class="btn btn-success w-100 mt-3"><i class="bi bi-lock-fill"></i> Confirm & Pay</button>
      </div>
    </div>

  </div>
{% endblock %}
